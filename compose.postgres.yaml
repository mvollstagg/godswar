name: godswar-dotnet

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${PG_DB:-godswar}
      POSTGRES_USER: ${PG_USER:-godswar}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-godswar}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - gw-pg-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-godswar} -d ${PG_DB:-godswar}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  gw-pg-data:
